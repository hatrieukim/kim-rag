<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kim-rag voices</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --accent-text: #ffffff; --chip: #f5f5f4; --danger: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --text: #f5f5f4; --muted: #a8a29e; --line: #3a3532;
      --accent: #60a5fa; --accent-text: #0c0a09; --chip: #322d2a; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 10px; }
  .sub { color: var(--muted); margin: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  button.chip { cursor: pointer; color: var(--text); }
  .role { font-style: italic; color: var(--muted); }
  input[type=text] { flex: 1; min-width: 140px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font: inherit; }
  button { font: inherit; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.play { width: 36px; height: 36px; padding: 0; border-radius: 50%; flex: none; }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); padding: 8px 0; }
  .voices { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .voices .row { padding: 4px 0; }
  #msg { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
         padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Voices</h1>
  <p class="sub" id="coverage">Loading…</p>

  <h2>Who is this?</h2>
  <div id="queue"></div>

  <h2>People</h2>
  <div id="people"></div>
</main>
<datalist id="names"></datalist>
<div id="msg"></div>

<script>
const TOKEN_KEY = "kimrag-token";
let token = "";
try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch {}
let player = null;
let openPerson = null;   // whose voice list stays open when the page reloads its data

async function api(path, options = {}) {
  const headers = Object.assign({}, options.headers || {});
  if (token) headers.Authorization = `Bearer ${token}`;
  const resp = await fetch(path, Object.assign({}, options, { headers }));
  if (resp.status === 401) {
    token = prompt("API token") || "";
    try { localStorage.setItem(TOKEN_KEY, token); } catch {}
    if (token) return api(path, options);
  }
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return resp;
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const minutes = (s) => s >= 90 ? `${Math.round(s / 60)} min` : `${Math.round(s)} s`;
const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";

function toast(text) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 2500);
}

// Clips are fetched once per page load: on hover, so a click usually plays at once.
const clips = new Map();
function clip(path) {
  if (!clips.has(path)) {
    const url = api(path).then((r) => r.blob()).then((b) => URL.createObjectURL(b));
    url.catch(() => clips.delete(path));
    clips.set(path, url);
  }
  return clips.get(path);
}

function playButton(button, path) {
  button.onpointerenter = () => clip(path).catch(() => {});
  button.onclick = () => play(button, path);
}

async function play(button, path) {
  const again = button.dataset.playing === "1";
  if (player) { player.pause(); player = null; }
  document.querySelectorAll("button.play").forEach((b) => { b.textContent = "▶"; b.dataset.playing = ""; });
  if (again) return;
  button.textContent = "…";
  button.dataset.playing = "1";
  try {
    const audio = new Audio(await clip(path));
    if (button.dataset.playing !== "1") return;   // stopped or another clip started while loading
    player = audio;
    button.textContent = "■";
    audio.onended = () => { button.textContent = "▶"; button.dataset.playing = ""; };
    await audio.play();
  } catch (err) { button.textContent = "▶"; button.dataset.playing = ""; toast(err.message); }
}

function queueCard(v) {
  const names = [...new Set([...v.names, ...v.invited])];
  const facts = [`heard on ${v.days} day${v.days > 1 ? "s" : ""}`, `${v.episodes} conversation${v.episodes > 1 ? "s" : ""}`,
                 minutes(v.speech_s), `last ${day(v.last_seen)}`];
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="row">
      <button class="play" title="Play">▶</button>
      <div class="grow">
        <div>${v.roles.length ? v.roles.map((r) => `<span class="role">${esc(r)}</span>`).join(", ") : "Unknown voice"}</div>
        <div class="meta">${facts.join(" · ")}</div>
      </div>
    </div>
    ${v.ignored_at ? `<div class="meta">Back again: marked not important on ${day(v.ignored_at)}, the numbers above are since then</div>` : ""}
    ${v.invited.length ? `<div class="meta">In a meeting with ${v.invited.map(esc).join(", ")}</div>` : ""}
    ${names.length ? `<div class="chips">${names.map((n) => `<button class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:10px">
      <input type="text" list="names" placeholder="Name">
      <button class="primary save">Save</button>
      <button class="ignore">Not important</button>
    </div>`;
  const input = card.querySelector("input");
  playButton(card.querySelector(".play"), `/speakers/${v.id}/clip`);
  card.querySelectorAll(".chip[data-name]").forEach((c) => (c.onclick = () => { input.value = c.dataset.name; input.focus(); }));
  const save = async () => {
    if (!input.value.trim()) return input.focus();
    try {
      const res = await (await api(`/speakers/${v.id}/name`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                          body: JSON.stringify({ name: input.value.trim() }) })).json();
      toast(`${res.merged ? "Merged into" : "Saved"} ${res.name}`);
      load();
    } catch (err) { toast(err.message); }
  };
  card.querySelector(".save").onclick = save;
  input.onkeydown = (e) => { if (e.key === "Enter") save(); };
  card.querySelector(".ignore").onclick = async () => {
    try { await api(`/speakers/${v.id}/ignore`, { method: "POST" }); toast("Will ask again only if it keeps turning up"); load(); }
    catch (err) { toast(err.message); }
  };
  return card;
}

function personCard(p) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="row">
      <button class="play" title="Play">▶</button>
      <div class="grow">
        <div><strong>${esc(p.name)}</strong>${p.is_me ? ' <span class="chip">me</span>' : ""}</div>
        <div class="meta">${p.episodes} conversation${p.episodes === 1 ? "" : "s"} · ${minutes(p.speech_s)} · ${p.prints} voiceprint${p.prints === 1 ? "" : "s"}${p.last_seen ? ` · last ${day(p.last_seen)}` : ""}</div>
      </div>
      <button class="link rename">Rename</button>
      <button class="link toggle">Voices</button>
    </div>
    <div class="voices" hidden></div>`;
  playButton(card.querySelector(".play"), `/speakers/${p.id}/clip`);
  card.querySelector(".rename").onclick = async () => {
    const name = prompt("New name (an existing name merges the two)", p.name);
    if (!name || name.trim() === p.name) return;
    try {
      await api(`/speakers/${p.id}/name`, { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ name: name.trim() }) });
      toast("Saved"); load();
    } catch (err) { toast(err.message); }
  };
  const box = card.querySelector(".voices");
  card.querySelector(".toggle").onclick = async () => {
    box.hidden = !box.hidden;
    openPerson = box.hidden ? null : p.id;
    if (box.hidden) return;
    try {
      const list = await (await api(`/speakers/${p.id}/voices`)).json();
      box.innerHTML = list.length ? "" : '<div class="empty">No recordings yet. The voice was learned from an enrolment file.</div>';
      for (const v of list) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<button class="play">▶</button>
          <div class="grow meta">${new Date(v.started_at).toLocaleString()} · ${minutes(v.speech_s)}${v.match_score ? ` · match ${v.match_score.toFixed(2)}` : ""}</div>
          <button class="link danger">Not ${esc(p.name)}</button>`;
        playButton(row.querySelector(".play"), `/voices/${v.episode_id}/${v.label}/clip`);
        row.querySelector(".danger").onclick = async () => {
          try {
            const res = await (await api(`/voices/${v.episode_id}/${v.label}/detach`, { method: "POST" })).json();
            toast(res.others ? `Unlinked, and ${res.others} similar voice${res.others > 1 ? "s" : ""} too` : "Unlinked");
            load();
          }
          catch (err) { toast(err.message); }
        };
        box.appendChild(row);
      }
    } catch (err) { box.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
  };
  if (openPerson === p.id) card.querySelector(".toggle").click();
  return card;
}

async function load() {
  try {
    const data = await (await api("/speakers/data")).json();
    const c = data.coverage;
    document.getElementById("coverage").textContent = c.total
      ? `Last 14 days: ${Math.round(100 * c.named / c.total)}% of recorded speech has a name, ${Math.round(100 * c.auto / c.total)}% named automatically.`
      : "No recorded speech in the last 14 days.";
    const queue = document.getElementById("queue");
    queue.innerHTML = data.queue.length ? "" : '<div class="empty">Nothing to name right now.</div>';
    data.queue.forEach((v) => queue.appendChild(queueCard(v)));
    const people = document.getElementById("people");
    people.innerHTML = data.people.length ? "" : '<div class="empty">Nobody yet. Enrol your voice with <code>lifelog speakers enroll FILE --me</code>.</div>';
    data.people.forEach((p) => people.appendChild(personCard(p)));
    document.getElementById("names").innerHTML = data.people.map((p) => `<option value="${esc(p.name)}">`).join("");
  } catch (err) {
    document.getElementById("coverage").textContent = `Could not load: ${err.message}`;
  }
}
load();
</script>
</body>
</html>
