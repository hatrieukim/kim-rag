[project]
name = "lifelog"
version = "0.1.0"
description = "A personal lifelog: audio in, conversations with speakers out, turned into memory an agent can ask."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.4",
    "silero-vad>=5.1",
    "pyannote.audio>=3.3",
    "google-genai>=1.0",
    "google-cloud-speech>=2.27",
    "graphiti-core[falkordb,google-genai]>=0.30.2",
    "mcp>=2.3.0",
]

[project.scripts]
lifelog = "lifelog.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifelog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
