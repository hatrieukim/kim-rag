<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>kim-rag Reading Log</title>
<style>
  :root { color-scheme: light dark; --muted: #6b6b6b; --line: #d9d9d9; --ok: #1f9d55; --warn: #c27c0e; }
  @media (prefers-color-scheme: dark) { :root { --muted: #9a9a9a; --line: #3a3a3a; } }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 16px 18px; min-width: 420px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.lead { margin: 0 0 14px; color: var(--muted); }
  .status { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.warn { background: var(--warn); }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .hint { color: var(--muted); font-weight: 400; }
  input, textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
                    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  textarea { height: 180px; resize: vertical; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  button { font: inherit; padding: 5px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
  #saved { color: var(--ok); opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
  <h1>kim-rag Reading Log</h1>
  <p class="lead">Ghi trang bạn đã đọc và gửi về server kim-rag trong máy. Không ghi tab ẩn danh, ô nhập liệu, trang có ô mật khẩu.</p>
  <div class="status"><span class="dot" id="dot"></span><span id="status">…</span></div>

  <label for="blocked">Trang không bao giờ đọc <span class="hint">· mỗi dòng một tên miền, khớp cả tên miền con</span></label>
  <textarea id="blocked" spellcheck="false"></textarea>

  <label for="server">Server</label>
  <input id="server" spellcheck="false">
  <label for="token">Token <span class="hint">· để trống khi server không đòi</span></label>
  <input id="token" type="password" autocomplete="off">

  <div class="row">
    <button id="reset">Khôi phục danh sách mặc định</button>
    <span><span id="saved">Đã lưu</span> <button class="primary" id="save">Lưu</button></span>
  </div>
<script src="scrub.js"></script>
<script src="options.js"></script>
</body>
</html>
